# The containers of Lynkeus. The front web server of the machine reaches them
# over the external network named below.

name: lynkeus

services:
  web:
    build: ./web
    image: lynkeus-web:local
    container_name: lynkeus-web
    restart: unless-stopped
    volumes:
      - ./data/team-log:/usr/share/nginx/html/team-log:ro
      # The files of the layers, which this container only reads.
      - ./data/api/files:/srv/lynkeus/files:ro
    networks:
      - proxy

  api:
    build: ./api
    image: lynkeus-api:local
    container_name: lynkeus-api
    restart: unless-stopped
    read_only: true
    mem_limit: 1g
    # An init process ends and collects the programs that a job leaves behind.
    init: true
    # A running job has 5 seconds to end when the container stops.
    stop_grace_period: 20s
    environment:
      HOME: /tmp
      # The folder of the record of sessions, jobs and layers and of the files of the layers.
      LYNKEUS_DATA_FOLDER: /data
    tmpfs:
      - /tmp
    volumes:
      - ./data/api:/data
    # One process only: the jobs and the Earthdata tokens are held in its memory.
    command: ["uvicorn", "lynkeus.server:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - proxy

  visits:
    build: ./api
    image: lynkeus-api:local
    container_name: lynkeus-visits
    restart: unless-stopped
    stop_signal: SIGINT
    read_only: true
    command: ["python", "-m", "lynkeus.visits", "--host", "0.0.0.0", "--count-file", "/data/visits.json"]
    volumes:
      - ./data/visits:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/healthz', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - proxy

networks:
  proxy:
    name: nkua-proxy
    external: true
