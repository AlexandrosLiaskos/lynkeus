# The containers of Lynkeus. The front web server of the machine reaches them
# over the external network named below.

name: lynkeus

services:
  web:
    image: nginx:1.27-alpine
    container_name: lynkeus-web
    restart: unless-stopped
    volumes:
      - ./web/site:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy

  visits:
    build: ./api
    image: lynkeus-api:local
    container_name: lynkeus-visits
    restart: unless-stopped
    read_only: true
    command: ["python", "-m", "lynkeus.visits", "--host", "0.0.0.0", "--count-file", "/data/visits.json"]
    volumes:
      - ./data/visits:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/healthz', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - proxy

networks:
  proxy:
    name: nkua-proxy
    external: true
