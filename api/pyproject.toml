[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lynkeus"
version = "0.1.0"
description = "Analysis of surface change with NISAR radar data."
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-only"
authors = [{ name = "Alexandros Liaskos" }]
dependencies = [
    "earthaccess==0.19.0",
    "fastapi==0.162.7",
    "harmony-py==1.8.0",
    "markdown==3.11.3",
    "numpy==2.5.4",
    "pydantic==2.14.3",
    "rasterio==1.5.2",
    "tzdata==2026.6",
    "uvicorn==0.54.0",
]

[project.urls]
Homepage = "https://lynkeus.nkua.cloud/"
Repository = "https://github.com/AlexandrosLiaskos/lynkeus"

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "jsonschema==4.26.0",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "rio-cogeo==7.0.4",
    "ruff==0.17.5",
    "types-jsonschema",
    "types-markdown",
]
# What packs Lynkeus Server as a download (api/packing).
pack = ["pyinstaller==6.22.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/lynkeus"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["A", "B", "C4", "D", "E", "F", "I", "N", "PTH", "RUF", "S", "SIM", "UP", "W"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D102", "D103", "S101"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["harmony.*", "rasterio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]
