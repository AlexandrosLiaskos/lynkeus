# Web server of the Lynkeus site. It runs behind the front web server of the
# machine, which ends HTTPS and passes the requests on.

limit_req_zone $binary_remote_addr zone=lynkeus_visits:1m rate=60r/m;
limit_req_zone $binary_remote_addr zone=lynkeus_api:1m rate=120r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/css text/javascript text/markdown;
    absolute_redirect off;

    # The front web server passes the address of the visitor in this header.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Real-IP;

    types {
        text/html        html;
        text/css         css;
        text/javascript  js;
        text/markdown    md;
        image/png        png;
        image/svg+xml    svg;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css text/javascript text/markdown image/svg+xml;

    add_header Cache-Control "no-cache, must-revalidate" always;
    # The map loads its background images from the two services named here.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://gibs.earthdata.nasa.gov https://tile.openstreetmap.org; frame-ancestors 'none'" always;

    # Total of recorded page visits. No request to it is logged.
    location = /api/visit {
        access_log off;
        limit_req zone=lynkeus_visits burst=20 nodelay;
        limit_except GET POST {
            deny all;
        }
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $visits http://lynkeus-visits:8766;
        proxy_pass $visits;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        add_header Cache-Control "no-store" always;
    }

    # The web service of Lynkeus, which the interface calls.
    location /api/ {
        limit_req zone=lynkeus_api burst=30 nodelay;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://lynkeus-api:8000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
