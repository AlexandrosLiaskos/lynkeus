# Web server of the Lynkeus site. It runs behind the front web server of the
# machine, which ends HTTPS and passes the requests on.

limit_req_zone $binary_remote_addr zone=lynkeus_visits:1m rate=60r/m;
limit_req_zone $binary_remote_addr zone=lynkeus_api:1m rate=120r/m;
# The own servers of the visitors (docs/Own_Servers.md). An own server asks for its tasks, reports and
# sends the parts of files, and a map reads many parts of a file, so each has a rate of its own. For
# every part that a map reads, the own server makes two requests: it sends the part and asks for its
# next tasks. Its rate is therefore more than twice the rate of the files. A request for a pairing
# needs no key, so few are taken from one address.
limit_req_zone $binary_remote_addr zone=lynkeus_link:1m rate=150r/s;
limit_req_zone $binary_remote_addr zone=lynkeus_pairings:1m rate=6r/m;
limit_req_zone $binary_remote_addr zone=lynkeus_files:1m rate=60r/s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/css text/javascript text/markdown;
    absolute_redirect off;

    # The front web server passes the address of the visitor in this header.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Real-IP;

    types {
        text/html        html;
        text/css         css;
        text/javascript  js;
        text/markdown    md;
        image/png        png;
        image/svg+xml    svg;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css text/javascript text/markdown image/svg+xml;

    add_header Cache-Control "no-cache, must-revalidate" always;
    # The map loads its background images from the two services named here. The
    # page asks api.github.com for the latest release of Lynkeus, which holds
    # the downloads of Lynkeus Server, and sends no other request off the site.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.github.com; img-src 'self' https://gibs.earthdata.nasa.gov https://tile.openstreetmap.org; frame-ancestors 'none'" always;

    # Total of recorded page visits. No request to it is logged.
    location = /api/visit {
        access_log off;
        limit_req zone=lynkeus_visits burst=20 nodelay;
        limit_except GET POST {
            deny all;
        }
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $visits http://lynkeus-visits:8766;
        proxy_pass $visits;
        # The cookie of the session is for the web service only.
        proxy_set_header Cookie "";
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        add_header Cache-Control "no-store" always;
    }

    # The web service of Lynkeus, which the interface calls. The landing page
    # of its processes is /api/, and /api without the slash is the same page.
    location = /api {
        rewrite ^ /api/ last;
    }

    location /api/ {
        limit_req zone=lynkeus_api burst=30 nodelay;
        limit_req_status 429;
        # The web service takes a request body of at most 65536 bytes.
        client_max_body_size 64k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://lynkeus-api:8000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        # An error that this web server finds itself is answered in the form
        # of the web service, with one sentence in the field "detail".
        error_page 413 = @body_too_large;
        error_page 429 = @too_many_requests;
        error_page 502 504 = @no_web_service;
    }

    # The connection of the own servers. A part of a file holds at most 524288 bytes, and the front web
    # server takes a body of 1 megabyte. A question for tasks waits for 25 seconds at most, so it ends
    # before the 60 seconds after which this server and the front web server end a request.
    location /api/link/ {
        limit_req zone=lynkeus_link burst=600 nodelay;
        limit_req_status 429;
        client_max_body_size 1m;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://lynkeus-api:8000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        error_page 413 = @link_body_too_large;
        error_page 429 = @too_many_requests;
        error_page 502 504 = @no_web_service;
    }

    location = /api/link/pairings {
        limit_req zone=lynkeus_pairings burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://lynkeus-api:8000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        error_page 413 = @body_too_large;
        error_page 429 = @too_many_requests;
        error_page 502 504 = @no_web_service;
    }

    # The files of the layers that an own server keeps. The web service reads them from that server
    # in parts and passes them on as they arrive, so this server holds no file. Parts of a file are
    # served on a Range request, as for the files of the project server below.
    location ~ "^/api/servers/[0-9a-f]{16}/files/" {
        limit_req zone=lynkeus_files burst=240 nodelay;
        limit_req_status 429;
        limit_except GET {
            deny all;
        }
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://lynkeus-api:8000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
        proxy_buffering off;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Content-Security-Policy;
        add_header Cache-Control "private, no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        error_page 429 = @too_many_requests;
        error_page 502 504 = @no_web_service;
    }

    location @link_body_too_large {
        default_type application/problem+json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 413 '{"type": "about:blank", "title": "Content Too Large", "status": 413, "detail": "The request body is larger than 1 megabyte."}';
    }

    location @body_too_large {
        default_type application/problem+json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 413 '{"type": "about:blank", "title": "Content Too Large", "status": 413, "detail": "The request body is larger than 65536 bytes."}';
    }

    location @too_many_requests {
        default_type application/problem+json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Retry-After "60" always;
        return 429 '{"type": "about:blank", "title": "Too Many Requests", "status": 429, "detail": "Too many requests came from your address. Wait a minute and try again."}';
    }

    location @no_web_service {
        default_type application/problem+json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Retry-After "60" always;
        return 503 '{"type": "about:blank", "title": "Service Unavailable", "status": 503, "detail": "The web service of Lynkeus does not answer at present. Try again in a minute."}';
    }

    # The files of the layers: for each layer a Cloud Optimized GeoTIFF and a
    # STAC Item. The web service writes them and this server only reads them.
    # The name of the folder of a layer is 32 random characters, so the address
    # of a file cannot be guessed. A file never changes, and the browser asks
    # on each use whether it still exists. Parts of a file are served on a
    # Range request. Any other address under /files/ does not exist, so the
    # folders cannot be listed.
    location /files/ {
        return 404;
    }

    location ~ "^/files/[0-9a-f]{32}/[^/]+\.(tif|json)$" {
        root /srv/lynkeus;
        types {
            "image/tiff; application=geotiff; profile=cloud-optimized"  tif;
            application/geo+json                                        json;
        }
        default_type application/octet-stream;
        limit_except GET {
            deny all;
        }
        add_header Cache-Control "private, no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
